l_english:
more_news.1.t:0 "Orcs Seize Dol Guldur"
more_news.1.d:0 "Elves in the southern reaches of Mirkwood are repositioning their forces. With increased activity and troop movements reported at the fortress of Dol Guldur, Elven command has ordered a strategic withdrawal. The troops are falling back from their forward positions to reinforce the main defenses in the northern parts of the forest. This consolidation is a direct response to the growing presence of enemy forces and the threat of large-scale military action from the fortress."
more_news.1.a:0 "Worrying..."
more_news.1.b:0 "Glee..."


more_news.2.t:0 "The Dwarves of Erebor slains the cold drake"
more_news.2.d:0 "The Dwarves of Erebor have slain the Cold-drake that haunted the peaks of the Ered Mithrin. With the beast destroyed, the long-abandoned halls of the Grey Mountains may now be reclaimed. Durin’s Folk turn their eyes northward once more, seeking to restore what was lost."
more_news.2.a:0 "Dragon?"
more_news.2.b:0 "Futile."