ANG_a_human_lead_industry_desc:0 ""
ANG_a_orc_lead_industry:0 "Orc led Industry"
ANG_a_orc_lead_industry_desc:0 ""

ANG_orc_breeding:0 "Orc Breeding Pits"
ANG_orc_breeding_desc:0 "In the dark halls of Carn Dûm, ancient pits once again stir. The breeding of orcs has resumed, swelling our armies with fierce and tireless soldiers."

ANG_orc_breeding2:0 "Expanded Breeding Pits"
ANG_orc_breeding2_desc:0 "The capacity of our breeding pits has been greatly increased. Orcs now pour forth in greater numbers, ready to die for the rebirth of Angmar."

ANG_orc_brutality:0 "Orcish Brutality"
ANG_orc_brutality_desc:0 "The orcs of Angmar know no mercy and show no restraint. Their methods are savage, their tactics cruel — and they are terrifyingly effective on the battlefield."

ANG_establish_orc_breeding_grounds:0 "Establish Orc Breeding Grounds"
ANG_establish_orc_breeding_grounds_desc:0 "In the dark halls of Carn Dûm, ancient pits once again stir. The breeding of orcs has resumed, swelling our armies with fierce and tireless soldiers."

ANG_more_orcs:0 "More Orcs"
ANG_more_orcs_desc:0 "The capacity of our breeding pits has been greatly increased. Orcs now pour forth in greater numbers, ready to die for the rebirth of Angmar."

ANG_embrace_orchish_brutality:0 "Embrace Orcish Brutality"
ANG_embrace_orchish_brutality_desc:0 "The orcs of Angmar know no mercy and show no restraint. Their methods are savage, their tactics cruel — and they are terrifyingly effective on the battlefield."

ANG_witch_king_force:0 "Force of the Witch-king"
ANG_witch_king_force_desc:0 "Empowered by the dark will of the Witch-king himself, our elite forces strike with unnatural precision and fury. His presence on the battlefield inspires terror and drives our special units beyond mortal limits."



