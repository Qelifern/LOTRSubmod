### Expanded Unaligned

ANG_the_path_of_balance:0 "Path of Balance"
ANG_the_path_of_balance_desc:0 "A shadow stirs in the East. For now, we shall set aside our ambitions in the South. The time has come to determine our course — will we remain neutral and self-reliant, or seek strength through bonds with our neighbors?"

ANG_rally_the_people:0 "Rally the People"
ANG_rally_the_people_desc:0 "Carn Dûm is growing once more, as families and workers return in search of stability and purpose. Though the future is uncertain, our people look to us for guidance. We must rally them around a common cause and begin shaping the road ahead."

ANG_put_the_squeeze_in:0 "A Permanent Solution"
ANG_put_the_squeeze_in_desc:0 "The raids from Gundabad have grown too frequent and severe to ignore. To secure our lands and people, we must take decisive action — war is the only path to lasting peace."

ANG_sole_masters_of_gundabad:0 "Sole Masters of Gundabad"
ANG_sole_masters_of_gundabad_desc:0 "Our power now reigns supreme over Gundabad. Many orcs have sworn fealty, while the rest have fled before our might. The land is firmly under our control, heralding a new era of dominance."

ANG_mend_the_conflict:0 "Mend the Conflict"
ANG_mend_the_conflict_desc:0 "Rather than resorting to war, we shall send envoys to Gundabad in hopes of easing tensions. Through careful diplomacy, we aim to quell raids and build a fragile peace with the orcs."

ANG_sign_a_pact_with_gundabad:0 "Sign a Pact with Gundabad"
ANG_sign_a_pact_with_gundabad_desc:0 "To bring lasting peace to our borderlands, we shall formally enact a non-aggression pact with Gundabad. This agreement seeks to end hostilities and open the way for cautious cooperation."

ANG_trade_deal_with_gundabad:0 "Trade Deal with Gundabad"
ANG_trade_deal_with_gundabad_desc:0 "With hostilities behind us, new opportunities arise. Establishing a trade agreement with Gundabad will strengthen our economies and foster cooperation across the borders."

ANG_a_new_age_for_angmar:0 "Angmar's New Age"
ANG_a_new_age_for_angmar_desc:0 "Our nation stands rebuilt from the ashes of the past. With strength, unity, and purpose, we now proudly proclaim the dawn of a new era — the Kingdom of Angmar rises once more."

ANG_invite_forodwaith_settlers:0 "Invite Forodwaith Settlers"
ANG_invite_forodwaith_settlers_desc:0 "To the north lies the harsh, frozen land of Forodwaith — home to scattered, hardy folk who have long endured the cold. In a bid to restore Carn Dûm, we shall reach out to these settlers and invite them southward. Their skills could aid our efforts, though such movement risks upsetting the fragile balance in the region."

ANG_integrate_the_settlers:0 "Settler Integration"
ANG_integrate_the_settlers_desc:0 "The people of the North hold customs different from our own. To build a strong and united nation, we must weave these diverse traditions into a shared identity."

ANG_learn_from_their_methods:0 "Forodwaith Ice-Fishing"
ANG_learn_from_their_methods_desc:0 "The frozen rivers and lakes of Forodwaith hold a hidden bounty. Let us master the ancient art of ice fishing."

ANG_give_the_settlers_jobs:0 "Settler Employment"
ANG_give_the_settlers_jobs_desc:0 "With growing numbers in our settlements, we can now fully employ our settlers, harnessing their skills to rebuild and strengthen our lands."

ANG_import_dwarven_steel:0 "Import Dwarven Steel"
ANG_import_dwarven_steel_desc:0 "Our craftsmen require the finest materials to rebuild Angmar’s strength. By importing steel from our dwarven allies, we shall ensure our armies are equipped with the best weapons and armor forged beneath the mountains."

ANG_align_with_erebor:0 "Align with Erebor"
ANG_align_with_erebor_desc:0 "Mordor has made no offers of peace — and if any should come, they cannot be trusted. The shadow grows, and neutrality may not be enough to shield us. To safeguard our future, we must seek an alliance with Erebor, whose strength and honor may yet keep Angmar free."

ANG_join_erebor:0 "Join Erebor"
ANG_join_erebor_desc:0 "Angmar shall formally join Erebor’s faction, standing united against the dark forces that threaten Middle-earth."

ANG_learn_from_the_dwarves:0 "Learn from the Dwarves"
ANG_learn_from_the_dwarves_desc:0 "The Dwarves’ mastery of craft and technology is renowned throughout Middle-earth. By sharing knowledge and skills, we can accelerate our own research efforts and forge a stronger future for Angmar."

ANG_skirmishes_with_the_gundabad_orcs:0 "Skirmishes with Gundabad"
ANG_skirmishes_with_the_gundabad_orcs_desc:0 "The orcs of Gundabad frequently raid our borderlands, testing our defenses with frequent skirmishes. We must respond carefully and firmly to protect our people and maintain control of the region."

ANG_forodwaith_settlers:0 "Forodwaith Settlers"

ANG_people_of_angmar:0 "People of Angmar"


### Army Focuses ###
ANG_army_of_angmar:0 "The Army of Angmar"
ANG_army_of_angmar_desc:0 "Our legions once marched south in terrifying strength, only to be broken at Fornost. We must learn from the past, rebuild our military doctrine, and forge an army worthy of our rebirth. Angmar shall never fall again."

ANG_legacy_of_long_past_wars:0 "Legacy of Long Past Wars"
ANG_legacy_of_long_past_wars_desc:0 "Though the Kingdom of Angmar lies in the shadow of history, the wars it waged were carefully recorded by those who survived. In these chronicles lie valuable lessons—strategies, failures, and tactics we shall study to prepare for the conflicts of tomorrow."

ANG_new_army_doctrine:0 "New Army Doctrine"
ANG_new_army_doctrine_desc:0 "The wars of old were fought with brute strength and overwhelming numbers. But times have changed. Our new doctrine emphasizes superior planning, coordination, and the development of specialized units to meet the challenges of modern warfare."

ANG_embrace_mounted_combat:0 "Embrace Mounted Combat"
ANG_embrace_mounted_combat_desc:0 "The harsh northern terrain has forged hardy riders, and we shall harness their strength. By investing in cavalry tactics and equipment, we enhance both the offensive and defensive capabilities of our mounted troops."

ANG_traditional_warfare:0 "Traditional Warfare"
ANG_traditional_warfare_desc:0 "The strength of disciplined infantry remains the backbone of any true army. We shall double down on tried and tested methods, bolstering our infantry for the conflicts ahead."

ANG_army_dynamic_modifier:0 "Angmar Army"
ANG_modify_army_dynamic_modifier_intro:0 "Modify §YAngmar Army§! by"
ANG_new_army_doctrine_tt:0 "$ANG_modify_army_dynamic_modifier_intro$ \n$MODIFIER_MAX_PLANNING$: §G+10.0%§! \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+25.0%§!\n\n"
ANG_embrace_mounted_combat_tt:0 "$ANG_modify_army_dynamic_modifier_intro$\n$MODIFIER_ARMY_ARMOR_ATTACK_FACTOR$: §G+10.00%§!\n$MODIFIER_ARMY_ARMOR_DEFENCE_FACTOR$: §G+5.00%§!\n\n"
ANG_traditional_warfare_tt:0 "$ANG_modify_army_dynamic_modifier_intro$\n$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+20%§!\n$MODIFIER_BREAKTHROUGH$: §G+2.5%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+10%§!\n$MODIFIER_ARMY_ORG_REGAIN$: §G+5%§!\n$modifier_army_sub_unit_infantry_attack_factor$: §G+5%§!\n$modifier_army_sub_unit_infantry_defence_factor$: §G+10%§!"



### Rebuilding Focuses ###
ANG_let_rebuilding_commence:0 "Let Rebuilding Commence"
ANG_let_rebuilding_commence_desc:0 "The ruins of Angmar whisper of ancient strength. Our first steps begin with hammer and flame."

ANG_refurbish_old_roads:0 "Refurbish the Old Roads"
ANG_refurbish_old_roads_desc:0 "Long-neglected paths once carved through the frozen plains and hills. Restoring them will allow faster movement of troops and supplies, and reconnect scattered outposts across the region."

ANG_clear_the_mountain_pass:0 "Clear the Mountain Pass"
ANG_clear_the_mountain_pass_desc:0 "The mountains around our domain hide veins of iron long untouched. With the right roads carved through rock and snow, we can reach these deposits and fuel our war machine."

ANG_delve_northeast_mountains:0 "Delve into the Northeastern Mountains"
ANG_delve_northeast_mountains_desc:0 "In the remote peaks of the northeast, ancient tunnels and ruins lie buried beneath ice and silence. Once sealed by the fall of Angmar, they now offer knowledge and relics from a forgotten era. We shall delve deep into these cold depths and reclaim what was lost."

ANG_invite_dwarves_to_mines:0 "Invite the Dwarves to the Mines"
ANG_invite_dwarves_to_mines_desc:0 "To better exploit the rich veins of iron hidden in our mountains, we extend an uneasy invitation to the Dwarves of Erebor. Their expertise and craftsmanship will be invaluable."

ANG_leather_trade_forochel:0 "Utilize the Ice Bay of Forochel"
ANG_leather_trade_forochel_desc:0 "The Ice Bay of Forochel offers a vital gateway for traders seeking the finest pelts and hides. By opening our doors to this leather trade, we enrich our lands and arm our warriors with durable leathers."

ANG_spin_up_the_factories:0 "Spin Up the Factories"
ANG_spin_up_the_factories_desc:0 "The ruined stronghold of Carn Dûm still holds dormant forges and factories buried under centuries of frost and stone. With effort, we shall breathe life into these industrial bones and prepare for the wars to come."

ANG_carn_dum_library:0 "Restore the Carn Dûm Library"
ANG_carn_dum_library_desc:0 "Beneath the black halls of Carn Dûm lies a vault of lost lore, ancient scripts, and forbidden knowledge. By restoring the library, we can draw upon the forgotten wisdom of shadowed ages to fuel our advancements."

ANG_economic_prosperity:0 "Economic Prosperity"
ANG_economic_prosperity_desc:0 "With our lands restored and trade flourishing, Angmar experiences newfound prosperity. Our citizens’ needs are better met, allowing more factories to be dedicated to the war effort."

ANG_economic_prosperity_idea:0 "Economic Prosperity"
ANG_economic_prosperity_idea_desc:0 "Our lands flourish and trade thrives, reducing the burden of consumer goods on our factories and strengthening Angmar’s economy."


ANG_carn_dum_alchemy:0 "Carn Dûm Alchemical Revival"
ANG_carn_dum_alchemy_desc:0 "Ancient tomes and forgotten arts are being unearthed beneath Carn Dûm. A new laboratory has been established to harness alchemical knowledge for the glory of Angmar."

ANG_delve_into_magic:0 "Delve into Magic"
ANG_delve_into_magic_desc:0 "We turn our gaze to the forgotten arts, seeking power hidden in ancient knowledge."

ANG_human_intellect:0 "Human Intellect"
ANG_human_intellect_desc:0 "By refining our understanding and methods, we accelerate our path to new discoveries."

ANG_goblin_researchers:0 "Goblin Researchers"
ANG_goblin_researchers_desc:0 "Crude, clever, and tireless—our goblin minds work day and night to push the boundaries of discovery."

ANG_haste:0 "Haste"
ANG_haste_desc:0 "Enchanted spells accelerate our troops, granting the army greater speed on the battlefield."


ANG_research_at_any_hour:0 "Extended Research Hours"
ANG_research_at_any_hour_desc:0 "Unlocks the ability to conduct research at any hour, boosting our scientific output."

ANG_approve_magic_in_factories:0 "Approve Magic Use in Factories"
ANG_approve_magic_in_factories_desc:0 "Harness arcane energies to enhance factory output, increasing production efficiency."

ANG_heavy_experimenting:0 "Heavy Experimenting"
ANG_heavy_experimenting_desc:0 "Invest deeply in alchemical research, accelerating breakthroughs and magical innovations."








### Naval Focuses ###
ANG_restore_dockyards:0 "Restore the Dockyards of Forochel"
ANG_restore_dockyards_desc:0 "The Ice Bay of Forochel once held dark piers and icebound harbors. Restoring the old dockyards will open new paths for trade, supply, and the construction of a shadowed fleet."

ANG_spies_of_angmar:0 "Eyes of Angmar"
ANG_spies_of_angmar_desc:0 "With the Ice Bay of Forochel active once more, merchants and agents now flow in and out under cover of trade. Let us use them to gather secrets, sow unrest, and serve our ambitions across all of Middle-earth."

ANG_streamline_our_spy_methods:0 "Refine the Eyes of Angmar"
ANG_streamline_our_spy_methods_desc:0 "Consolidate and enhance our intelligence operations. Our reach will expand, ensuring no secret remains hidden from Angmar."

ANG_the_frozen_fleet:0 "The Frozen Fleet"
ANG_the_frozen_fleet_desc:0 "The frozen fleet will rise once more, as we rebuild Angmar's glory upon the seas. Our ships will patrol the icy waters of the north and extend our influence far beyond the mountains."

ANG_frozen_fleet:0 "Frozen Fleet"
ANG_frozen_fleet_desc:0 "Our icy waters conceal a fleet reborn. The Frozen Fleet will patrol the northern seas, defending Angmar’s shores and asserting our power over the waters of Middle-earth."

ANG_sea_based_trade_idea:0 "Sea-Based Trade"
ANG_sea_based_trade_idea_desc:0 "Our ports grant us the advantage of better trade prices and stronger economic ties across the seas."

ANG_extend_dockyards:0 "Extend Dockyards"
ANG_extend_dockyards_desc:0 "Expand the dockyards along the northern coasts to increase our shipbuilding capacity and secure our dominance over the frozen seas."

ANG_sea_based_trade:0 "Sea-Based Trade"
ANG_sea_based_trade_desc:0 "Our ports are a marvel of the North, enabling us to secure better prices and favorable terms when trading with distant lands across the seas."







