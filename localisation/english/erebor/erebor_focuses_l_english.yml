l_english:
ERE_iron_hills_governship:0 "Iron Hills Governorship"
ERE_iron_hills_governship_desc:0 "The Iron Hills remain a stronghold of dwarven resilience. We shall formally establish our presence through structured governance and mutual cooperation."

ERE_grey_mountains:0 "Resettle the Grey Mountains"
ERE_grey_mountains_desc:0 "The dragons that once ravaged our ancient halls are long gone. It is time to reclaim the Grey Mountains for our kin."

ERE_grey_mountains_dragon_slain:0 "The Cold-Drake is Slain"
ERE_grey_mountains_dragon_slain_desc:0 "A mighty Cold-drake, long dormant in Ered Mithrin, has fallen to dwarven steel. The Grey Mountains are safe once more."

ERE_iron_hills_indepence_path:0 "Recognize Iron Hills Autonomy"
ERE_iron_hills_indepence_path_desc:0 "The Iron Hills have long stood proud and strong. We may support a path toward greater independence and mutual respect."

ERE_iron_hills_indepence_resources:0 "Resource Agreement with the Iron Hills"
ERE_iron_hills_indepence_resources_desc:0 "As part of growing autonomy, the Iron Hills will share their wealth of ores and fuel in a new trade accord."

ERE_iron_hills_indepence:0 "Iron Hills Declare Independence"
ERE_iron_hills_indepence_desc:0 "A new age dawns for the dwarves of the Iron Hills, as they step forth as a sovereign power. Though our bonds remain, they now stand alone."

ERE_iron_hills_control_path:0 "Assert Control over the Iron Hills"
ERE_iron_hills_control_path_desc:0 "Rather than allow disunity, Erebor will reaffirm its authority over the Iron Hills to ensure the unity of Durin's folk."

ERE_iron_hills_unite:0 "Unite the Mountain Holds"
ERE_iron_hills_unite_desc:0 "With the Iron Hills secured under Erebor’s leadership, it is time to consolidate all our mountain kin into a single realm."

ERE_iron_hills_annex:0 "Annex the Iron Hills"
ERE_iron_hills_annex_desc:0 "Through diplomacy or necessity, the Iron Hills have become one with Erebor. Durin's folk stand united once more."

ERE_dwarf_women:0 "Are there no Dwarf Women?"
ERE_dwarf_women_desc:0 "It's true you don't see many Dwarf-women. And in fact, they are so alike in voice and appearance, that they are often mistaken for Dwarf-men!"


ERE_homeofthedwarves:0 "Home of the Dwarves"
ERE_homeofthedwarves_desc:0 "Erebor stands as the proud heart of Dwarven culture, a symbol of resilience and craftsmanship. Our people have weathered many storms, and here, among the mountains and mines, we have found our true home."

ERE_politicaleffort:0 "Dwarven Politics"
ERE_politicaleffort_desc:0 ""
